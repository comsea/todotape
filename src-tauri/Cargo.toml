[package]
name = "todo-tape"
version = "1.0.0"
description = "TO·DO·TAPE — retro groove todo list"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "todo_tape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "todo-tape"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-store        = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart    = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"
strip   = true
